<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(120deg, #c98d9b, #ffe1d5, #963e4b);
        min-height: 100vh;
      }

      .card {
        background-color: #f5d5ce;
        border: none;
        border-radius: 20px;
      }

      h1,
      label,
      a {
        margin: 20px;
        color: #843744;
      }

      .form-control {
        background: transparent;
        border: none;
        border-bottom: 1px solid #843744;
        border-radius: 0;
      }

      .btn-login {
        background-color: #cf929b;
        color: #843744;
        border-radius: 25px;
      }

      .imagem {
        width: 100%;
        height: 480px;
        object-fit: cover;
        border-radius: 20px;
        position: relative;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>

  <body class="d-flex align-items-center">
    <main class="container">
      <div class="row justify-content-center align-items-center">
        <div class="col-12 col-md-6">
          <div class="card shadow p-4">
            <h1 class="text-center mb-4">Login</h1>

            <form id="formulario">
              <div class="mb-3">
                <label for="usuario" class="form-label"> Usuário </label>

                <input
                  type="text"
                  id="usuario"
                  class="form-control"
                  placeholder="Digite seu usuário"
                />
              </div>

              <div class="mb-3">
                <label for="senha" class="form-label"> Senha </label>

                <input
                  type="password"
                  id="senha"
                  class="form-control"
                  placeholder="Digite sua senha"
                />
              </div>

              <button
                type="submit"
                id="botao"
                class="btn btn-login w-75 d-block mx-auto"
              >
                Entrar
              </button>
            </form>

            <p id="mensagem" class="text-center mt-3"></p>

            <div class="progress mt-3" id="area-barra" hidden>
              <div
                class="progress-bar progress-bar-striped progress-bar-animated"
                id="barra"
                style="width: 0%"
              ></div>
            </div>

            <p id="porcentagem" class="text-center mt-2" hidden>0%</p>

            <div class="text-center mt-3">
              <a href="mudar-senha.html">Mudar senha</a>
            </div>
          </div>
        </div>

        <div class="col-10 col-md-4 mt-4 mt-md-0">
          <img src="sua-imagem.jpg" alt="Imagem decorativa" class="imagem" />
        </div>
      </div>
    </main>

    <script>
      const usuarios = [
        { usuario: "Juan", senha: "123" },
        { usuario: "Maria", senha: "456" },
        { usuario: "Joao", senha: "789" },
      ];

      const formulario = document.querySelector("#formulario");
      const campoUsuario = document.querySelector("#usuario");
      const campoSenha = document.querySelector("#senha");
      const botao = document.querySelector("#botao");
      const mensagem = document.querySelector("#mensagem");
      const areaBarra = document.querySelector("#area-barra");
      const barra = document.querySelector("#barra");
      const porcentagem = document.querySelector("#porcentagem");

      formulario.addEventListener("submit", async function (event) {
        event.preventDefault();

        const usuario = campoUsuario.value.trim();
        const senha = campoSenha.value;

        const encontrado = usuarios.some(
          (u) => u.usuario === usuario && u.senha === senha,
        );

        if (!encontrado) {
          mensagem.textContent =
            usuario === "" || senha === ""
              ? "Preencha os campos corretamente!"
              : "Usuário ou senha incorretos!";

          mensagem.className = "text-center mt-3 text-danger";
          return;
        }

        mensagem.textContent = "Login correto! Carregando...";
        mensagem.className = "text-center mt-3 text-success";

        areaBarra.hidden = false;
        porcentagem.hidden = false;
        botao.disabled = true;

        let progresso = 0;

        while (progresso < 100) {
          await new Promise((resolve) => setTimeout(resolve, 50));

          progresso += 10;
          barra.style.width = progresso + "%";
          porcentagem.textContent = progresso + "%";
        }

        window.location.href = "usuario.html";
      });
    </script>
  </body>
</html>
